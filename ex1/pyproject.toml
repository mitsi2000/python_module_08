[project]
name = "matrix-loading"
version = "0.1.0"
description = "Matrix data loading and analysis program"
authors = [
    {name = "mitrakot", email = "mcmillergrant@gmail.com"}
]
requires-python = ">=3.10"
dependencies = [
    "numpy (>=1.26.0,<2.0.0)",
    "pandas (>=2.1.0,<3.0.0)",
    "matplotlib (>=3.8.0,<4.0.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"